# SBP4AI 面板挂在 nginx 子路径下的参考配置
#
# 适用：https://host/<prefix>/  → 本机或 tunnel 另一头的 SBP4AI 面板。
# 前提：面板版本 >= 1.0.7（知道自己挂在哪条前缀下，见 panel README「挂在反代子路径下」）。
#
# 关键点：
#   1) 只留**一条** location。面板是单进程，UI / /api / /ws / /static 都自己提供，
#      不要再拆成 api、ws、static 多条 location —— 那是旧 vite 前端时代的写法。
#   2) proxy_pass 结尾必须带 `/`，这样 /<prefix>/xxx 会被剥成 /xxx 再给面板。
#   3) X-Forwarded-Prefix 告诉面板对外前缀，页面里的 URL 才会跟着加前缀。
#      比环境变量 PANEL_BASE 灵活：同一个实例可以同时服务根路径和多个子路径。
#   4) 不要再加 sub_filter 去改 '/api'、'/src'、'/node_modules' —— 那是给旧 vite 前端的，
#      留着只会把新面板的输出改坏。
#   5) WebSocket 必须放行 Upgrade；流式输出建议 proxy_buffering off。

# ---- 最简单的形态：面板就在本机 ----
location /ecs-coder-panel/ {
    proxy_pass http://127.0.0.1:20016/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 面板据此输出 /ecs-coder-panel/static/... /ecs-coder-panel/api/... /ecs-coder-panel/ws
    proxy_set_header X-Forwarded-Prefix /ecs-coder-panel;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# ---- 面板在隧道另一头（frp）：多一层外部登录门时要处理它自己的跳转 ----
# 下面是家机经 frpc 到本机的例子（comfyui 登录门在远端 nginx 上）。
#   location /gpu-coder-panel/ {
#       proxy_pass http://127.0.0.1:20050/;
#       ...同上四行 proxy_set_header...
#       proxy_set_header X-Forwarded-Prefix /gpu-coder-panel;
#
#       # 远端登录门的 302 要接回本前缀，否则登录完会被送回站点根
#       proxy_redirect ~^/login\?next=(/.*)$ /gpu-coder-panel/login?next=/gpu-coder-panel$1;
#       proxy_redirect ~^/login$ /gpu-coder-panel/login;
#
#       # 登录页本体是远端服务渲染的，没有前缀注入，只能改字符串
#       proxy_set_header Accept-Encoding "";
#       proxy_buffering on;
#       sub_filter_types text/html;
#       sub_filter 'action="/login"' 'action="/gpu-coder-panel/login"';
#       sub_filter 'name="next" value="/"' 'name="next" value="/gpu-coder-panel/"';
#       sub_filter_once off;
#   }
#
# 注意：X-Forwarded-Prefix 是靠 nginx 默认转发请求头透传到远端 nginx 的；
# 若中间那层配了 `proxy_set_header X-Forwarded-Prefix ""` 之类的清空，前缀就丢了。

# 验收：下面三条都应是 200（未登录时最后一条是 401/302，取决于面板自身鉴权）
#   curl -sI https://host/ecs-coder-panel/                     | head -1
#   curl -s  https://host/ecs-coder-panel/ | grep -o 'window.__PANEL_BASE__="[^"]*"'
#   curl -sI https://host/ecs-coder-panel/static/app.js        | head -1
