# SBP4AI：一个控制台页面 + N 台机器上的 sbp-server
#
# 与 sbp-panel-subpath.conf（面板本身挂子路径）的区别：这里挂的是 **sbp-server**
# 的 WebSocket，客户端是 sbp-console（纯静态页面）或微信小程序，两者都靠
# SBP 握手帧里的 HMAC 签名鉴权，不再需要浏览器的 cookie 登录门。
#
# 关键点：
#   1) location 与请求的路径都要带末尾斜杠。客户端访问的是 /sbp-ecs/ws，
#      少了斜杠 nginx 回 301，而 WebSocket 握手吃不下 301 —— 表现是一直重连。
#   2) Upgrade / Connection 必须放行，长连接要把超时拉长、缓冲关掉。
#   3) 隧道另一头的机器可以复用已有的 frp 隧道，只换路径，不用新开端口。

# ---- 控制台页面本身：纯静态，随便放哪台机器上都行 ----
location /sbp-console/ {
    alias /opt/sbp4ai/sbp-console/;    # 改成实际路径
    index index.html;
    add_header Cache-Control "no-store";
}

# ---- 云机本机的 sbp-server（127.0.0.1:8787）----
location /sbp-ecs/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# ---- 隧道另一头的机器（frpc -> 本机 frps 20050 -> 那台机器的 nginx）----
# 对端 nginx 上同样加一条：
#   location /sbp-gpu/ { proxy_pass http://127.0.0.1:8798/; ...同上... }
# 注意对端这条**不要挂 auth_request 登录门**：鉴权由 HMAC 签名负责。
location /sbp-gpu/ {
    proxy_pass http://127.0.0.1:20050/sbp-gpu/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# 验收：
#   curl -s https://host/sbp-ecs/api/health          # 应有 "auth":{"hmac":true}
#   curl -s https://host/sbp-gpu/api/health
#   curl -s -o /dev/null -w '%{http_code}' https://host/sbp-console/    # 200
# 控制台里「测试连接」应该报出「设备 N 台 · 会话 M 个」。
